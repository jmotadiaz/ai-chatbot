name: ai-chatbot-dev
services:
  postgres:
    container_name: postgres-dev
    image: pgvector/pgvector:pg17
    command: '-d 1'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata-dev: