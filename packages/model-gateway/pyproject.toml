[project]
name = "model-gateway"
version = "0.1.0"
description = "Model Gateway de la máquina: LiteLLM Proxy stateless (config.yaml, sin DB) + endpoint FastAPI del Model Catalog."
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]>=1.104.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
