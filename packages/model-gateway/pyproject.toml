[project]
name = "model-gateway"
version = "0.1.0"
description = "Model Gateway de la máquina: LiteLLM Proxy stateless (config.yaml, sin DB) + endpoint FastAPI del Model Catalog."
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]>=1.104.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# El despliegue instala este proyecto en el venv de /opt/model-gateway para
# resolver sus dependencias; los módulos de runtime se importan desde el
# WorkingDirectory de la unidad (`uvicorn server:app`), no de site-packages.
[tool.setuptools]
py-modules = ["server", "catalog"]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
