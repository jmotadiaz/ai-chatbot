[project]
name = "model-gateway"
version = "0.1.0"
description = "The machine's Model Gateway: stateless LiteLLM Proxy (config.yaml, no DB) + FastAPI Model Catalog endpoint."
requires-python = ">=3.11"
dependencies = [
    "litellm[proxy]>=1.104.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Deployment installs this project into the /opt/model-gateway venv so its
# dependencies resolve; the runtime modules are imported from the unit's
# WorkingDirectory (`uvicorn server:app`), not from site-packages.
[tool.setuptools]
py-modules = ["server", "catalog"]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
