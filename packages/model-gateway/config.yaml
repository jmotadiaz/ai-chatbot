      context_window: 160000
      max_output_tokens: 131072
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
      cache_creation_input_token_cost: 0
      reasoning: true
      thinking_levels: ["low", "medium", "high", "xhigh", "max"]
      default_thinking_level: "high"
      supported_files: []
      supported_output: [text]
      zero_data_retention: false
      default_temperature: null
      default_top_p: null
      default_top_k: null

  - model_name: Claude Haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_base: https://opencode.ai/zen/go
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      user_invocable: true
      is_default: false
      company: anthropic
      # Not the provider window: above 100k the upstream price tier steps up, so
      # this is the ceiling that keeps the model on its base rate. The provider
      # still accepts more; we simply never let a session grow past it.
      context_window: 100000
      max_output_tokens: 128000
      input_cost_per_token: 1.0e-7
      output_cost_per_token: 5.0e-7
      cache_read_input_token_cost: 1.0e-8
      cache_creation_input_token_cost: 1.25e-7
      reasoning: true
      # The full Pi built-in ladder; adaptive thinking (effort) is the
      # client's business: the gateway only routes.
      thinking_levels: ["off", "minimal", "low", "medium", "high", "xhigh", "max"]
      default_thinking_level: "high"
      supported_files: [img, pdf]
      supported_output: [text]
      zero_data_retention: false
