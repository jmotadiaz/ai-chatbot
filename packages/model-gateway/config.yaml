# Model Gateway — stateless LiteLLM Proxy (single source of truth, no DB).
#
# Conventions:
# - `model_name` is the stable catalog `id` (also the `model` that consumers
#   accept in /v1/chat/completions, etc.).
# - `model_info` migrates 1:1 the metadata of packages/models/src/catalog.ts:
#   costs in native LiteLLM keys PER TOKEN (input_cost_per_token,
#   output_cost_per_token, cache_read_input_token_cost,
#   cache_creation_input_token_cost) — the original catalog expressed them per
#   million; GET /v1/models/catalog re-expresses them per million.
#   `thinking_levels` are the levels resolved with the semantics of
#   getSupportedThinkingLevels (catalog thinkingLevelMap + Pi built-ins);
#   for Qwen 3.8 Max the catalog default ends up clamped to the closest
#   supported level.
# - API keys NEVER go in this file: os.environ/<VAR>, injected by
#   scripts/run-gateway.sh from systemd-creds ($CREDENTIALS_DIRECTORY).
# - `router_settings.model_group_alias` publishes stable family/tier aliases
#   (e.g. deepseek-flash): consumers invoke the alias and the concrete version
#   is re-pointed here without touching their code. They are routing-ONLY:
#   they do not enter GET /v1/models/catalog nor the picker, and `hidden: true`
#   keeps LiteLLM's native /v1/models from duplicating them.

general_settings:
  # Same credential as the /v1/models/catalog endpoint of server.py.
  master_key: os.environ/MODEL_GATEWAY_API_KEY
  # No periodic metadata refresh against the upstreams' /models: config.yaml
  # is the single source of truth (stateless), so the service makes no
  # outgoing calls every 5 min (cost and noise).
  disable_model_info_refresh: true

litellm_settings:
  drop_params: true
  num_retries: 3

# ---------------------- Stable family/tier aliases -----------------------
# They only resolve the request `model` to the canonical model below; the
# catalog (and therefore the picker) keeps publishing the canonical ids.
# `hidden: true` takes them out of LiteLLM's native listing (/v1/models).
#
# A version bump is done in this file: the model entry is added/updated in
# `model_list` and its alias is re-pointed here. Consumers that invoke the
# alias do not change. There is no `deepseek-pro` alias because the gateway
# does not have (nor need today) a Pro tier for Deepseek: only v4.1 Flash.
router_settings:
  model_group_alias:
    deepseek-flash:
      model: Deepseek v4.1 Flash
      hidden: true
    glm-flash:
      model: GLM 5.3 Flash
      hidden: true
    glm-pro:
      model: GLM 5.3
      hidden: true
    mimo-flash:
      model: MiMo V2.6 Flash
      hidden: true
    mimo-pro:
      model: MiMo V2.6 Pro
      hidden: true
    meta-muse-spark:
      model: Muse Spark 1.3
      hidden: true
    free:
      model: Beam Free
      hidden: true

model_list:
  # ---------- 21 user_invocable: true models (model selector) --------------
  #
  # `context_window` is the EFFECTIVE budget our clients get, not the window the
  # provider advertises. Consumers (Pi in the coding-agent, the chatbot
  # compaction) derive their threshold from it — Pi compacts at
  # `context_window - 16_384`, the chatbot at `context_window - min(16_384, 10%)` —
  # and overflow detection uses the same number. Declaring the provider's 1M
  # makes that threshold unreachable in practice: every turn re-sends the whole
  # context, so a tool loop of ~6 requests/minute at 350k tokens already blows a
  # 2M input-tokens-per-minute plan long before the window fills.
  #
  # Rule: effective = the tighter of
  #   - plan_input_TPM / sustained_requests_per_minute, and
  #   - the cheapest upstream price tier we want to stay in.
  #   100_000 — Claude Haiku: the upstream price tier steps up above 100k, so
  #             we cap there to stay on the base rate. Compaction then fires at
  #             83_616 (Pi) / 90_000 (chatbot), i.e. before the premium tier.
  #   160_000 — Google AI Studio (Tier 1: 2M input TPM; the Gemini models share
  #             the key) and the free tiers (Beam Free, Iceman Contributor Free,
  #             LongCat 2.5 Free): 2_000_000 / 12 req/min.
  #   200_000 — the rest (OpenCode Go limits are capacity-based, not a per-minute
  #             token quota): a wide margin over what a session actually needs,
  #             far below the provider window, and it keeps compaction and
  #             per-turn cost bounded.
  #
  # When a model's real window grows or its plan changes, adjust this number:
  # it is the only knob that decides when sessions compact.
  #
  # `max_output_tokens` is NOT derived from it: it is the provider's declared
  # output cap, and Pi uses it to decide whether a `length` stop was self-
  # inflicted (`isRecoverableLength`: stop === length && output < maxTokens).
  # Lowering it to the effective window would both truncate legitimate long
  # answers and misclassify provider truncation, so leave it as the provider
  # says. The request only has to satisfy input + max_tokens <= the REAL window,
  # which the effective window above already keeps comfortable.

  # Deepseek v4.1 Flash — catalog default (always first: the rest goes
  # alphabetical, see the order in `catalog.py:build_catalog`).
  - model_name: Deepseek v4.1 Flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      user_invocable: true
      is_default: true
      company: deepseek
      context_window: 200000
      max_output_tokens: 384000
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.0e-7
      cache_read_input_token_cost: 3.0e-9
      cache_creation_input_token_cost: 0
      reasoning: true
      thinking_levels: ["off", "low", "high", "xhigh"]
      default_thinking_level: "xhigh"
      supported_files: [img]
      supported_output: [text]
      zero_data_retention: true
      default_temperature: 1
      default_top_p: 0.95
      default_top_k: null

  # Beam Free — free for a limited time on OpenCode Go (limited regions).
  # It goes through the OpenAI-compatible endpoint (not anthropic-messages) and
  # the provider declares "Not used" / 30 days (no zero-retention).
  - model_name: Beam Free
    litellm_params:
      model: openai/beam-free
      api_base: https://opencode.ai/zen/go/v1
