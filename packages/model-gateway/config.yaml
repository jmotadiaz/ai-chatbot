# Model Gateway — LiteLLM Proxy stateless (única fuente de verdad, sin DB).
#
# Convenciones:
# - `model_name` es el `id` estable del catálogo (también el `model` que aceptan
#   los consumidores en /v1/chat/completions, etc.).
# - `model_info` migra 1:1 los metadatos de packages/models/src/catalog.ts:
#   costes en claves nativas de LiteLLM POR TOKEN (input_cost_per_token,
#   output_cost_per_token, cache_read_input_token_cost,
#   cache_creation_input_token_cost) — el catálogo original los expresaba por
#   millón; GET /v1/models/catalog los re-expresa por millón.
#   `thinking_levels` son los niveles resueltos con la semántica de
#   getSupportedThinkingLevels (thinkingLevelMap del catálogo + built-ins de Pi);
#   para Kimi K3 y Qwen 3.8 Max el default del catálogo queda clampeado al nivel
#   soportado más cercano.
# - Las API keys NUNCA van en este fichero: os.environ/<VAR>, inyectadas por
#   scripts/run-gateway.sh desde systemd-creds ($CREDENTIALS_DIRECTORY).
# - `router_settings.model_group_alias` publica aliases estables de familia/tier
#   (p. ej. deepseek-flash): los consumidores invocan el alias y aquí se
#   reapunta la versión concreta sin tocarles el código. Son SOLO de enrutado:
#   no entran en GET /v1/models/catalog ni en el picker, y `hidden: true` evita
#   que el /v1/models nativo de LiteLLM los duplique.

general_settings:
  # Misma credencial que el endpoint /v1/models/catalog de server.py.
  master_key: os.environ/MODEL_GATEWAY_API_KEY
  # Sin refresco periódico de metadatos contra los /models de los upstreams:
  # config.yaml es la única fuente de verdad (stateless) y así el servicio no
  # hace llamadas salientes cada 5 min (coste y ruido).
  disable_model_info_refresh: true

litellm_settings:
  drop_params: true
  num_retries: 3

# ------------------- Aliases estables de familia/tier --------------------
# Solo resuelven el `model` de la petición al modelo canónico de abajo; el
# catálogo (y por tanto el picker) sigue publicando los ids canónicos.
# `hidden: true` los saca del listado nativo de LiteLLM (/v1/models).
#
# Un bump de versión se hace en este fichero: se añade/actualiza la entrada del
# modelo en `model_list` y se reapunta su alias aquí. Los consumidores que
# invocan el alias no cambian. No hay alias `deepseek-pro` porque el gateway no
# tiene (ni necesita hoy) un tier Pro de Deepseek: solo v4.1 Flash.
router_settings:
  model_group_alias:
    deepseek-flash:
      model: Deepseek v4.1 Flash
      hidden: true
    glm-flash:
      model: GLM 5.3 Flash
      hidden: true
    glm-pro:
      model: GLM 5.3
      hidden: true
    mimo-flash:
      model: MiMo V2.6 Flash
      hidden: true
    mimo-pro:
      model: MiMo V2.6 Pro
      hidden: true
    meta-muse-spark:
      model: Muse Spark 1.3
      hidden: true
    free:
      model: Beam Free
      hidden: true

model_list:
