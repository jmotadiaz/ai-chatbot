  # decision-default — Perplexity Decider V1.2 via OpenRouter.
  # Served by LiteLLM's native /v1/decisions and /v1/systemone routes.
  # Decider V1.2 is a decisions model (no chat completions): text + image state
  # in, typed probabilistic answers out, 262k context at $0.019/M input tokens.
  # ZDR: OpenRouter lists exactly two providers for it (Perplexity and Makora)
  # and both are zero-retention (`is_zdr: true`, `retainsPrompts: false`), so a
