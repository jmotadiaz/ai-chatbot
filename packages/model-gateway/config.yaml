# Model Gateway — LiteLLM Proxy stateless (única fuente de verdad, sin DB).
#
# Convenciones:
# - `model_name` es el `id` estable del catálogo (también el `model` que aceptan
#   los consumidores en /v1/chat/completions, etc.).
# - `model_info` migra 1:1 los metadatos de packages/models/src/catalog.ts:
#   costes en claves nativas de LiteLLM POR TOKEN (input_cost_per_token,
#   output_cost_per_token, cache_read_input_token_cost,
#   cache_creation_input_token_cost) — el catálogo original los expresaba por
#   millón; GET /v1/models/catalog los re-expresa por millón.
#   `thinking_levels` son los niveles resueltos con la semántica de
#   getSupportedThinkingLevels (thinkingLevelMap del catálogo + built-ins de Pi);
#   para Kimi K3 y Qwen 3.8 Max el default del catálogo queda clampeado al nivel
#   soportado más cercano.
# - Las API keys NUNCA van en este fichero: os.environ/<VAR>, inyectadas por
#   scripts/run-gateway.sh desde systemd-creds ($CREDENTIALS_DIRECTORY).

general_settings:
  # Misma credencial que el endpoint /v1/models/catalog de server.py.
  master_key: os.environ/MODEL_GATEWAY_API_KEY

litellm_settings:
  drop_params: true

model_list:
  # ---------- 14 modelos user_invocable: true (selector de modelos) ----------

  # Deepseek v4.1 Flash — default del catálogo (chatModelKeys[0]).
  - model_name: Deepseek v4.1 Flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
    model_info:
      user_invocable: true
      is_default: true
      company: deepseek
      context_window: 1000000
      max_output_tokens: 384000
      input_cost_per_token: 1.5e-7
      output_cost_per_token: 6.0e-7
      cache_read_input_token_cost: 3.0e-9
      cache_creation_input_token_cost: 0
      reasoning: true
      thinking_levels: ["off", "low", "high", "xhigh"]
      default_thinking_level: "xhigh"
      supported_files: [img]
      supported_output: [text]
      zero_data_retention: true
      default_temperature: 1
      default_top_p: 0.95
      default_top_k: null

  - model_name: Kimi K3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://opencode.ai/zen/go/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
    model_info:
      user_invocable: true
      is_default: false
      company: moonshotai
      context_window: 1048576
      max_output_tokens: 131072
      input_cost_per_token: 3.0e-6
      output_cost_per_token: 1.5e-5
      cache_read_input_token_cost: 3.0e-7
      cache_creation_input_token_cost: 0
      reasoning: true
      # thinkingLevelMap del built-in de Pi: solo `max` está soportado; el
      # default "high" del catálogo se clampea a "max".
      thinking_levels: ["max"]
      default_thinking_level: "max"
      supported_files: [img]
      supported_output: [text]
      zero_data_retention: false
      default_temperature: null
      default_top_p: null
      default_top_k: null

