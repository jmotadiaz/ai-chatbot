# Model Gateway — stateless LiteLLM Proxy (single source of truth, no DB).
#
# Conventions:
# - `model_name` is the stable catalog `id` (also the `model` that consumers
#   accept in /v1/chat/completions, etc.).
# - `model_info` migrates 1:1 the metadata of packages/models/src/catalog.ts:
#   costs in native LiteLLM keys PER TOKEN (input_cost_per_token,
#   output_cost_per_token, cache_read_input_token_cost,
#   cache_creation_input_token_cost) — the original catalog expressed them per
#   million; GET /v1/models/catalog re-expresses them per million.
#   `thinking_levels` are the levels resolved with the semantics of
#   getSupportedThinkingLevels (catalog thinkingLevelMap + Pi built-ins);
#   for Kimi K3 and Qwen 3.8 Max the catalog default ends up clamped to the
#   closest supported level.
# - API keys NEVER go in this file: os.environ/<VAR>, injected by
#   scripts/run-gateway.sh from systemd-creds ($CREDENTIALS_DIRECTORY).
# - `router_settings.model_group_alias` publishes stable family/tier aliases
#   (e.g. deepseek-flash): consumers invoke the alias and the concrete version
#   is re-pointed here without touching their code. They are routing-ONLY:
#   they do not enter GET /v1/models/catalog nor the picker, and `hidden: true`
#   keeps LiteLLM's native /v1/models from duplicating them.

general_settings:
  # Same credential as the /v1/models/catalog endpoint of server.py.
  master_key: os.environ/MODEL_GATEWAY_API_KEY
  # No periodic metadata refresh against the upstreams' /models: config.yaml
  # is the single source of truth (stateless), so the service makes no
  # outgoing calls every 5 min (cost and noise).
  disable_model_info_refresh: true

litellm_settings:
  drop_params: true
  num_retries: 3

# ---------------------- Stable family/tier aliases -----------------------
# They only resolve the request `model` to the canonical model below; the
# catalog (and therefore the picker) keeps publishing the canonical ids.
# `hidden: true` takes them out of LiteLLM's native listing (/v1/models).
#
# A version bump is done in this file: the model entry is added/updated in
# `model_list` and its alias is re-pointed here. Consumers that invoke the
# alias do not change. There is no `deepseek-pro` alias because the gateway
# does not have (nor need today) a Pro tier for Deepseek: only v4.1 Flash.
router_settings:
  model_group_alias:
    deepseek-flash:
      model: Deepseek v4.1 Flash
      hidden: true
    glm-flash:
      model: GLM 5.3 Flash
      hidden: true
    glm-pro:
      model: GLM 5.3
      hidden: true
    mimo-flash:
      model: MiMo V2.6 Flash
      hidden: true
    mimo-pro:
      model: MiMo V2.6 Pro
      hidden: true
    meta-muse-spark:
      model: Muse Spark 1.3
      hidden: true
    free:
      model: Beam Free
      hidden: true

model_list:
