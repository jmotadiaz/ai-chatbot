# pnpm v11 Workspace Configuration
packages:
  - 'packages/*'

engineStrict: true

# Allow build/postinstall scripts execution for the following dependencies:
allowBuilds:
  '@google/genai': true
  bcrypt: true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
