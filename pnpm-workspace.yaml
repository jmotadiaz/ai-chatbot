packages:
  - 'packages/*'

# No engineStrict and no `engines` in package.json on purpose. The toolchain is
# expressed as a preference — `.node-version` and `packageManager` — not as a
# hard floor, because the deploy target does not always offer the exact pair
# they name (Vercel resolves pnpm from the lockfile, which is format 9.0, and
# refuses to honour a pnpm 11 pin). Enforcing them turned that mismatch into
# ERR_PNPM_UNSUPPORTED_ENGINE and failed the build outright.

# Allow build/postinstall scripts execution for the following dependencies.
#
# Declared twice on purpose. pnpm 11 reads `allowBuilds` and silently ignores
# `onlyBuiltDependencies`; pnpm 10 reads only the latter. Since the pnpm version
# is no longer pinned by an engine range, whichever one the environment brings
# has to find a list it understands — otherwise these dependencies install
# without ever building, and sharp, bcrypt and better-sqlite3 fail at runtime
# rather than at install time. Keep both lists in sync.
allowBuilds:
  '@google/genai': true
  # `false` = never run its postinstall (a type-check helper). pnpm 11 fails the
  # install with ERR_PNPM_IGNORED_BUILDS when a dependency with a build script
  # has no explicit entry; pnpm 10 ignores unlisted scripts silently.
  '@openrouter/sdk': false
  bcrypt: true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.197'
  - '@ai-sdk/provider-utils@4.0.52'
  - '@openrouter/sdk@1.3.11'
  - ai@6.0.287
  - '@ai-sdk/react@3.0.290'

onlyBuiltDependencies:
  - '@google/genai'
  - bcrypt
  - better-sqlite3
  - bufferutil
  - esbuild
  - msw
  - protobufjs
  - sharp
  - unrs-resolver
